<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board</title>
    <style>
      .empty-state {
  color: #64748b;
  justify-content: center;
  text-align: center;
  background: #f8fafc;
  border-style: dashed;
}

* {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f7fb;
  color: #1e293b;
  max-width: 850px;
  margin: 0 auto;
  padding: 32px 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 24px;
  color: #0f172a;
}

h2 {
  font-size: 22px;
  margin-top: 36px;
  color: #0f172a;
}

input {
  width: 100%;
  padding: 13px 15px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  outline: none;
  background: white;
  margin-bottom: 14px;
}

input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px #dbeafe;
}

ul {
  padding: 0;
}

li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  list-style: none;
  margin: 12px 0;
  padding: 16px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 9px 15px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#saved-jobs button {
  background: #dc2626;
}

#saved-jobs button:hover {
  background: #b91c1c;
}

#status {
  min-height: 22px;
  color: #15803d;
  font-size: 14px;
}

@media (max-width: 600px) {
  body {
    padding: 20px 14px;
  }

  h1 {
    font-size: 27px;
  }

  li {
    align-items: flex-start;
  }
}

    </style>
  </head>
  <body>
<h1>Jobs</h1>

<input
  id="search"
  placeholder="Search by title, company or place"
/>

<p id="status" role="status" aria-live="polite"></p>

<ul id="jobs"></ul>

<h2>Saved jobs</h2>
<ul id="saved-jobs"></ul>
    <script type="module" src="/app.js"></script>
  </body>
</html>
